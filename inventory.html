<!doctype html>
<html lang="vi">
<head>
<title>Kho đồ GunnyShop</title>

<meta charset="utf-8">

<style>
body{
font-family:Arial;
background:#f5f7fb;
padding:20px;
}

.box{
background:white;
border:1px solid #ddd;
border-radius:12px;
padding:15px;
margin:15px;
text-align:center;
width:220px;
display:inline-block;
}

img{
width:100px;
height:100px;
object-fit:contain;
}

button{
background:#1976d2;
color:white;
border:0;
padding:10px 20px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}
</style>

</head>

<body>

<h1>🎒 Kho đồ</h1>

<input id="username"
placeholder="Tên tài khoản"
value="Admin">

<button onclick="loadInventory()">
XEM KHO
</button>

<hr>

<div id="inventory">
Đang chờ...
</div>


<script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.17.0/firebase-firestore-compat.js"></script>


<script>

const firebaseConfig = {
apiKey: "AIzaSyATAyA0P_epVEm2NloWe6EQirGE-ENRerY",
authDomain: "gunnyshop-fa0ce.firebaseapp.com",
projectId: "gunnyshop-fa0ce",
storageBucket: "gunnyshop-fa0ce.firebasestorage.app",
messagingSenderId: "201890914947",
appId: "1:201890914947:web:e8d3291543f17fd728b1b6"
};


firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();



async function loadInventory(){

let username =
document.getElementById("username").value.trim();


let box =
document.getElementById("inventory");


box.innerHTML="Đang tải...";


try{


const snap =
await db.collection("inventory")
.doc(username)
.collection("items")
.get();



if(snap.empty){

box.innerHTML=
"Kho đồ chưa có vật phẩm.";

return;

}



let html="";


snap.forEach(doc=>{


let item=doc.data();


html+=`

<div class="box">


<img src="${item.image}">


<h3>
${item.name}
</h3>


<p>
Số lượng:
<b>
${item.quantity || 1}
</b>
</p>

<button onclick="equipItem('${doc.id}')">
TRANG BỊ
</button>


</div>

`;


});


box.innerHTML=html;



}catch(e){

box.innerHTML=
"Lỗi: "+e.message;

}



}

async function equipItem(itemId){

const username =
document.getElementById("username").value.trim();


try{


const itemDoc =
await db.collection("inventory")
.doc(username)
.collection("items")
.doc(itemId)
.get();


if(!itemDoc.exists){

alert("Không tìm thấy vật phẩm");

return;

}


const item=itemDoc.data();



await db.collection("equipment")
.doc(username)
.set({

itemId:itemId,

name:item.name,

image:item.image,

type:item.type || "item",

time:
firebase.firestore.FieldValue.serverTimestamp()

});


alert("Đã trang bị "+item.name);



}catch(e){

alert(e.message);

}


}
</script>


</body>
</html>
